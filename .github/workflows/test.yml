name: Tests
# Runs on every pull request to catch regressions before merge.
# Postgres image is pinned to pg16 to match production instance.
# Update the image tag AND this comment when upgrading.
# Ollama is not available in CI; OLLAMA_SKIP=1 skips embedding
# assertions while structural tests (chunker logic, DB schema,
# incremental sync) still run. The eval-retrieval harness runs
# in --ollama-skip mode -- it exercises the SQL/loader/schema path
# but skips vector-quality regression detection. Run the full
# harness locally to catch retrieval-quality regressions.
on: [pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: scripts/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: scripts
      - name: Apply schema
        run: psql -h localhost -U postgres -f scripts/setup.sql
        env:
          PGPASSWORD: postgres
      - name: Run chunker tests
        run: node scripts/test-chunker.js
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/postgres
          OLLAMA_SKIP: '1'
      - name: Create eval test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE claude_memory_eval_test"
        env:
          PGPASSWORD: postgres
      - name: Run retrieval eval (FTS-only smoke test)
        run: node test/eval/eval-retrieval.js --ollama-skip
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          EVAL_DB_NAME: claude_memory_eval_test
          # Propagates into the loader subprocess that eval STEP 5 spawns;
          # without this, the loader tries Ollama-on-localhost and fails 3x per fixture.
          OLLAMA_SKIP: '1'
      - name: Run graph edge-traversal tests
        # Exhaustive harness for kind:'graph' recursive-CTE retrieval feature.
        # Creates/drops throwaway DBs; uses the same Postgres service as the other steps.
        run: node scripts/test-graph-traversal.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run smoketest (all sections)
        # Runs the full smoketest suite — all 13 sections including collision (OQ-5
        # supersession invariant) and registry (SQL-1:1-index-vs-registry-JSON drift).
        # Previously only --section=gr ran in CI; those two correctness properties were
        # unproven per-PR.  The full run subsumes the former gr-only step exactly.
        run: node scripts/smoketest-handoff.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
