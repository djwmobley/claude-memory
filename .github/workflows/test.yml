name: Tests
# Runs on every pull request to catch regressions before merge.
# Postgres image is pinned to pg16 to match production instance.
# Update the image tag AND this comment when upgrading.
# vLLM is not available in CI; EMBED_SKIP=1 skips embedding
# assertions while structural tests (chunker logic, DB schema,
# incremental sync) still run. The eval-retrieval harness runs
# in --embed-skip mode -- it exercises the SQL/loader/schema path
# but skips vector-quality regression detection. Run the full
# harness locally to catch retrieval-quality regressions.
on: [pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: scripts/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: scripts
      - name: Apply schema
        run: psql -h localhost -U postgres -f scripts/setup.sql
        env:
          PGPASSWORD: postgres
      - name: Run chunker tests
        run: node scripts/test-chunker.js
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/postgres
          EMBED_SKIP: '1'
      - name: Create eval test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE claude_memory_eval_ci"
        env:
          PGPASSWORD: postgres
      - name: Run retrieval eval (FTS-only smoke test)
        run: node test/eval/eval-retrieval.js --embed-skip
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          EVAL_DB_NAME: claude_memory_eval_ci
          # Propagates into the loader subprocess that eval STEP 5 spawns;
          # without this, the loader tries embedding-on-localhost and fails 3x per fixture.
          EMBED_SKIP: '1'
      - name: Create handoff test database
        # test-handoff.js and test-serve-time-staleness.js connect to claude_memory_eval_test
        # (hardcoded TARGET_DB). Create it early — before graph-traversal — so that a
        # single test-suite failure cannot cascade into a spurious "DB does not exist"
        # failure in the north-star steps (which run with if: always()). The test's
        # setup() then applies handoff-core-schema.sql AND app-retrieval-events-schema.sql
        # into it (both are idempotent). This step is a no-op if the DB already exists.
        run: psql -h localhost -U postgres -c "CREATE DATABASE claude_memory_eval_test" || true
        env:
          PGPASSWORD: postgres
      - name: Run init atomicity tests
        # Regression guard for the handoff init atomicity fix (#125).
        # A1-A3: pure unit tests for mintUUID() / persistMarker() (no Postgres required).
        # A4-A5: subprocess injection — unreachable PGHOST forces DB-connect failure;
        #        asserts no .claude-memory marker written and no false "No FS writes made".
        # A6-A7: live Postgres — success path writes marker last; re-init idempotency.
        # A8:    FS-ledger unwind — failed handoff.md write cleans up; marker never written
        #        (POSIX chmod injection; skipped on Windows).
        # Creates/drops throwaway DBs for A6/A7/A8; does NOT use claude_memory_eval_test.
        run: node scripts/test-init-atomic.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run init confirmation gate tests
        # Regression guard for the init DB-confirmation gate (#126).
        # C1: resolved DB name and source tier printed before DDL (pipeline.yml tier).
        # C2: -y bypass proceeds — init completes and writes .claude-memory marker.
        # C3: non-TTY safe-fail — exits non-zero, prints refusal, no marker, no hang
        #     (enforced by 5-second subprocess timeout; key non-vacuous test).
        # C1/C2 use throwaway DBs; C3 does NOT require Postgres (gate fires before preflight).
        run: node scripts/test-init-confirm.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run graph edge-traversal tests
        # Exhaustive harness for kind:'graph' recursive-CTE retrieval feature.
        # Creates/drops throwaway DBs; uses the same Postgres service as the other steps.
        run: node scripts/test-graph-traversal.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run migrate-01-canonical-db tests
        # Tests scripts/migrations/migrate-01-canonical-db.js, the first migration
        # that stands up a consolidation target database (staging-first: default
        # target memory_manager_staging). No cutover/data-migration of any kind.
        # Covers: fresh apply + verification PASS, refusal on a non-empty target
        # without --allow-existing, idempotent re-run with --allow-existing (zero
        # net change), proof-of-firing (verifyTarget FAILS and names a table
        # dropped post-apply), the refusal branch for --db claude_memory_eval_test
        # firing before any DB connection is opened (unreachable-PGHOST proof),
        # refusal of pipeline_*/claude_policy_framework/unrecognized names (total
        # classification — unknown names are refused by default, not allowed
        # through), rejection of an invalid identifier, HANDOFF_DB being ignored
        # (behavioral proof via --db vs HANDOFF_DB divergence), MIGRATE_TARGET_DB
        # env resolution, the built-in default (unit-tested only — never invokes
        # the CLI with no --db, so memory_manager_staging is never created here),
        # and CREATE DATABASE race-safety under real concurrency (both the 42P04
        # and the empirically-observed 23505/pg_database_datname_index shapes).
        # Creates/drops its own _staging-suffixed scratch DBs; never touches
        # claude_memory_eval_test beyond the connection-avoidance assertion.
        run: node test/migrations/test-migrate-01.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run verify-15 acceptance-battery tests
        # Tests scripts/migrations/verify-15-*.js, the §15 acceptance T-battery
        # (13 checks + T10 aggregator) that gates staging->canonical promotion.
        # Proof-of-firing coverage for every check (T0/T0-completeness/T1/
        # freeze-precondition/T2/T2.5/T3/T3b/T4/T5/T6/T7/T8/T9), the T9 NULL-
        # scoped provenance fixture, the T10 recorded_by independence
        # cross-check, and a static sweep for zero live `NOT IN (` SQL in any
        # authored script. Self-contained: creates/drops its own _staging-
        # suffixed scratch DBs; writes roster/fixture JSON to the OS temp dir
        # (never the repo); never touches claude_memory_eval_test/
        # claude_policy_framework/pipeline_*/memory_manager_staging.
        run: node test/migrations/test-verify-15.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run smoketest (all sections)
        # Runs the full smoketest suite — all 13 sections including collision (OQ-5
        # supersession invariant) and registry (SQL-1:1-index-vs-registry-JSON drift).
        # Previously only --section=gr ran in CI; those two correctness properties were
        # unproven per-PR.  The full run subsumes the former gr-only step exactly.
        run: node scripts/smoketest-handoff.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run SQLite seam tests
        # Unit and integration tests for the SQLite storage adapter (db-seam.js).
        # Guards: resolveDialect, rewriteForSQLite, schema application, JSONB round-trip,
        # graph CTE, abstraction invariant (Section 13), PR-B bi-temporal columns,
        # canonicalization (Section 15), manual prune (Section 16), cmdInit resilience
        # (Section 17), and L5 buildRetirementUpdate SQLite-arm (Section 18).
        # Requires Node >= 22 for node:sqlite built-in; CI now runs Node 22 so both halves gate.
        run: node scripts/test-sqlite-seam.js
      - name: Run both-backend behavioral parity + adversarial-invariant sweep
        # Runs the full adversarial-invariant sweep on BOTH Postgres and SQLite:
        #   S1  PR-B bi-temporal columns (both backends)
        #   S2  Probation lifecycle: live→probation→rehab→re-downable
        #   S3  Terminal is terminal: downvoted_terminal not revived by rehab
        #   S4  Pinned exemption: auto-suppress blocked; explicit override allowed
        #   S5  Canonicalization × supersession: §7 byte-unchanged proof
        #   S6  Prune × bi-temporal: kind-filter precision; dry-run; idempotency; scoping
        #   S7  C2 gate invariant: gate-ON/OFF delta is ONLY outcome_bias term (static)
        #   S8  Abstraction invariant: zero dialect conditionals outside composition root (static + port checks)
        #   S9  Do-not-touch constants: 86400 JS constants intact (static)
        #   S10 No-backfill guarantee: no UPDATE SET subject in engine (static)
        #   S19 L5 buildRetirementUpdate: dual-backend retirement invariants (both adapters)
        # Postgres half always runs (service is available). SQLite half runs on Node >= 22.
        # CI now runs Node 22 — both halves gate; zero Node-version skips.
        run: node scripts/test-both-backends.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run pr-independence hook tests
        # Regression guard for the scrubDataRegions zero-false-negative guarantee
        # and the detection logic vendored from ~/.claude/hooks/pr-independence.js.
        # Pure Node — no Postgres or Ollama required; reuses the Node 22 setup above.
        run: node hooks/pr-independence.test.js
      - name: Run agent-adversary-floor hook tests
        # Regression guard for the PreToolUse hook that blocks Agent-tool spawns
        # to write-capable subagents unless the prompt carries a blind-spot/
        # completeness framing clause or a well-formed exemption marker (#147).
        # Pure Node — no Postgres or Ollama required; reuses the Node 22 setup above.
        run: node hooks/agent-adversary-floor.test.js
      - name: Run plugin packaging tests
        # Validates the Claude Code plugin manifest (.claude-plugin/plugin.json,
        # marketplace.json, hooks/hooks.json), CLAUDE_PLUGIN_ROOT asset resolution,
        # loader-hook inertness when no .claude-memory marker is present, and the
        # no-silent-SQLite-fallback guard in plugin mode.
        # Pure Node — no Postgres or Ollama required.
        run: node scripts/test-plugin-packaging.js
      - name: Run install engine-path tests
        # Tests install.js .engine-path recording (standalone-install path discovery)
        # and static consistency checks across all 9 command files:
        #   A1  Normal install writes .engine-path with correct absolute engine path
        #   A2  --dry-run writes nothing (no .engine-path created)
        #   A3  .engine-path content is a forward-slash path ending in /scripts/handoff.js
        #   A4  .engine-path is co-located with command files in destDir
        #   B1  Every command file has the HANDOFF_ENGINE tier-1 override check
        #   B2  Every command file has the .engine-path fallback
        #   B3  No command file has the old bare "is this a claude-memory project?" error
        #   B4  Every command file has the improved standalone error with both fix options
        # Pure Node — no Postgres or Ollama required; writes to OS temp dir only.
        run: node scripts/test-install-engine-path.js
      - name: Run L4 degraded-close tests
        # Tests Lever L4: fail-loud, persist-to-DB, resume-visible skip record when
        # C2 (feedback bias) or C3 (contract evolution) skip due to unresolvable
        # session id at close time. Covers: clean-close byte-equivalence, C2/C3
        # degraded_close row persistence, ## Degraded section in handoff.md,
        # summary-line surfacing, resume RESUME WARNING banner, and exit-code gate
        # (warn=exit 0, strict=exit 3).
        run: node scripts/test-l4-degraded-close.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run degraded_close retention unit tests
        # Focused unit tests for pruneDegradedClose() in isolation (no retrieval_events
        # required). Covers: 110 seeded → 100 remain (oldest 10 deleted), 2 seeded →
        # both retained (no-op), custom keep=5 on 8 records, on both Postgres and SQLite.
        run: node test/handoff/test-degraded-close-retention.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run L3 reality-check registry tests
        # Tests Lever L3: generalizes the single hard-coded reality-bound assertion
        # (packaging state) into a reality-check registry with a strictly non-mutating
        # verify pass. Covers: golden byte-equivalence of authoritative packaging
        # injection, registry dispatch (authoritative strips+injects, verify does not
        # strip), verify match → reality_check='verified' (conf/source/tier unchanged),
        # verify mismatch → reality_check='mismatch' (conf/source/tier unchanged) +
        # recordDegradedClose + L4 resume banner, probe failure → fail-soft
        # 'unverifiable' + close exits normally, reality_check column present after
        # init, no UPDATE SET tier on pre-existing rows (static scan), and
        # is_at_commit is not listed as authoritative (design-of-record guard).
        run: node scripts/test-l3-reality-checks.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run L0 consolidation gate tests
        # Tests Lever L0: severs the single-close consolidation forge (Attack 1).
        # A single close with source='user_stated', conf>=9 and no genuine prior-session
        # corroboration must produce tier='probationary' (not 'consolidated') when the
        # consolidation_corroboration_gate setting is 'enforce' (the default).
        # Covers: Attack-1 closed (core security assertion), genuine 1:N and 1:1
        # corroboration consolidates, payload-supplied session_id cannot forge the gate,
        # pinned suppression exemption unaffected, disabled=byte-identical to pre-L0
        # (golden equivalence), no UPDATE SET tier on pre-existing rows (static + behavioral),
        # and same-session fake corroboration rejected (defense-in-depth).
        run: node scripts/test-l0-consolidation-gate.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run L2 consolidation gate tests
        # Tests Lever L2: corroboration-quality plug (positive-evidence form) that closes
        # the patient-adversary gap in L0. A model that restates the same forged triple
        # across >=2 genuine distinct sessions satisfies L0 crossSessionCorroborated but
        # still forges 'consolidated' under L0 alone. L2 arm(b) requires >=1 corroborating
        # prior-session row to be independently trustworthy (reality_check='verified' OR
        # pinned) -- positive-evidence form only. THR/count thresholds retired.
        # Covers: patient-adversary closed (2 and 20 self-stamped corroborations ->
        # probationary), arm(a)/(b) via verified/pinned corroborator -> consolidated,
        # arm(c) operator-pinned incoming -> consolidated, single self-stamped still
        # probationary (L0 property preserved), disabled/report byte-identical to L0,
        # report emits would-withhold log, enforce changes outcomes, CLAUDE.md transitive
        # binding (only gate-consolidated eligible), candidate-query bug fixed (id+tier),
        # no UPDATE SET tier on pre-existing rows.
        run: node scripts/test-l2-consolidation-gate.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run L5 directive retirement tests
        # Tests Lever L5: non-destructive, operator-only retirement of 1:N directive
        # assertions whose rule text has changed. Covers: registry directive flag (7
        # predicates marked), isDirective() helper, loadRegistry rejects non-boolean
        # directive values, buildRetirementUpdate port methods (both SQLite and Postgres
        # adapters), cmdRetire dry-run safety, --apply --object pinpoint retirement,
        # --apply without --object mass-retirement for directive predicates,
        # non-directive without --object refused (exit 2), retired row excluded from
        # live retrieval but still in table (recoverable), --replace-with flag rejected
        # (exit 2), prune --suppression-kind retired accepted, no UPDATE SET tier in
        # cmdRetire, and cmdRetire not wired into any automated path.
        run: node scripts/test-l5-directive-retirement.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run resurrect query-type tests
        # Tests the resurrect query type (Part 4 of the L2-enforce ring):
        #   R-1  Eligibility predicate: probation resurfaces; terminal/superseded do NOT
        #   R-2  M2 forge-gate: uncorroborated probation blocked; pinned/verified passes
        #   R-3  Sub-budget enforcement: min(global, resurrect_token_budget) honored
        #   R-4  Default-contract byte-identical (I-2 guard — no resurrect section)
        #   R-5  pg_trgm fallback under EMBED_SKIP=1
        #   R-6  Depth-2 graph fan-out from seeded subjects
        #   R-7  Read-only-by-default vs explicit revive opt-in (q.revive=true)
        run: node scripts/test-resurrect.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          EMBED_SKIP: '1'
      - name: Generate embed fixtures (synthetic, no vLLM required)
        # Generates test/handoff/fixtures/embed-fixtures.json with deterministic
        # synthetic vectors that satisfy all cosine-similarity invariants by
        # construction (no live vLLM required in CI). The --synthetic flag
        # produces 4000-dim unit vectors with guaranteed sim >= 0.75 for close
        # pairs and sim ≈ 0 for distant pairs, using a seeded PRNG.
        # Re-run locally with --synthetic to regenerate, or without the flag to
        # use real vLLM vectors (requires vLLM at http://localhost:8800).
        run: node scripts/dev/generate-embed-fixtures.js --synthetic
      - name: Run resurrect semantic-seed tests
        # Tests A–I for the P1 semantic embedding path (issue #81):
        #   A  Basic semantic-only match via cosine ANN on assertions.embedding
        #   B  Cosine threshold gate (default 0.75; configurable via project_settings)
        #   C  M2 forge-gate enforced even when semantic seed matches
        #   D  Terminal suppression is absolute regardless of semantic match
        #   E  Idempotency: second revive run produces revivedRows=0
        #   F  Multi-project isolation: project A seed does not resurface project B rows
        #   G  Token-budget enforcement: section suppressed when budget exhausted
        #   H  Empty corpus: no crash, exit 0, no ### Resurrected section
        #   I  Embed backend degradation: bad fixture path → warning → fuzzy fallback;
        #      EMBED_SKIP=1 → straight to fuzzy, no embed.js invoked
        # Mock strategy: EMBED_MOCK_FIXTURES_PATH=test/handoff/fixtures/embed-fixtures.json
        # Fixture file generated by the previous step — no live vLLM required in CI.
        run: node test/handoff/test-resurrect-semantic.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run operator-pin tests
        # Tests the operator-pin.js standalone script (Part 3 of the L2-enforce ring):
        #   P-1  Dry-run writes nothing (exit 0, no DB rows)
        #   P-2  --apply inserts rows: pinned=true, source=user_stated,
        #        confidence=10, tier=consolidated, suppressed=false, invalid_at=NULL
        #   P-3  Idempotent re-run: second --apply is a no-op (no duplicates)
        #   P-4  operator-pin NOT in handoff.js dispatch map (static check)
        #   P-5  Invalid facts skipped without crash; valid fact still inserted
        run: node scripts/test-operator-pin.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run payload-schema unit tests
        # Tests scripts/lib/payload-schema.js directly (no DB required):
        #   T1  buildPayloadSchema() returns expected top-level structure
        #   T2  valid payload with empty arrays accepted
        #   T3  recognized predicate — ok=true, no warnings, no errors
        #   T4  missing assertions array treated as valid
        #   T5  assertions not an array — error
        #   T6  assertion item not a plain object — error
        #   T7  null predicate skipped (not a vocabulary error)
        #   T8  numeric predicate — error
        #   T9  unrecognized predicate in permissive mode — warning, ok=true
        #   T10 unrecognized predicate in strict mode — error, ok=false
        #   T11 recognized predicate in strict mode — ok, no error, no warning
        #   T12 empty payload object — ok=true
        #   T13 null payload — error
        #   T14 array payload — error
        #   T15 CRLF in string fields validates same as LF (line-ending invariant)
        #   T16 mixed CRLF/LF validates same as LF
        #   T17 schema predicate enum matches recognizedPredicates()
        # Pure unit test — no Postgres or Ollama required.
        run: node scripts/test-payload-schema.js
      - name: Run async-queue state-machine tests
        # Tests the async extraction queue paths in handoff.js via subprocess:
        #   T1  Enqueue creates a pending row (extraction_async_enabled=true)
        #   T2  Queue-drain processes pending→done
        #   T3  session_id absent + session_in_progress cleared — no crash,
        #       entities written with null sessionId (documented L4-degraded behavior)
        #   T4  Idempotent re-drain: done row not re-processed
        #   T5  Empty queue drain — clean no-op, exit 0
        # Requires Postgres (uses throwaway DB); skips gracefully if unavailable.
        run: node scripts/test-async-queue.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run config-loading unit tests
        # Tests loadConfig and findProjectRoot in scripts/lib/shared.js:
        #   T1  Pure LF pipeline.yml parses correctly (baseline)
        #   T2  Pure CRLF parses to byte-identical values as LF — no \r in any value
        #   T3  Mixed CRLF/LF — same no-\r guarantee
        #   T4  Absent pipeline.yml falls back to documented defaults
        #   T5  findProjectRoot honors PROJECT_ROOT env var
        #   T6  findProjectRoot walks up from cwd to .git
        #   T7  project name derived from root directory basename (no config)
        #   T8  knowledge object has all required fields in no-config fallback
        # Pure file-system unit test — no Postgres or Ollama required.
        run: node scripts/test-config-loading.js
      - name: Run OS-portability invariant assertions
        # Static invariant sweep over the source tree — mirrors S8/S9/S10 style:
        #   P1  pg connection is OS-uniform (no platform branch in connectHandoff)
        #   P2  no shell:true anywhere in scripts/, hooks/, test/
        #   P3  only sanctioned platform branch is shared.js runWinBin
        #   P4  marker/handoff writes are LF-only (static + behavioral)
        #   P5  no POSIX-only assumptions in test suite (no hardcoded /tmp, etc.)
        # Pure static analysis — no Postgres or Ollama required.
        run: node scripts/test-os-portability.js
      - name: Run documentation lint (glossary cross-refs + command refs + suppression_kind enum sync)
        # Static documentation lint — catches doc drift before merge:
        #   D1  glossary cross-refs: every See-also bold term resolves to a defined ### heading
        #   D2  command-ref validity: /handoff:<name> matches commands/handoff/<name>.md;
        #       `node ... handoff.js <sub>` in code spans matches the subcommands router
        #   D3  suppression_kind enum sync: validKinds in cmdPrune + glossary bullet
        #       both equal the canonical set in the SQL schema CHECK constraint
        # Pure static analysis — no Postgres or Ollama required.
        run: node scripts/test-doc-lint.js
      - name: Run schema suppression_kind ordering tests
        # Regression guard for the suppression_kind CHECK constraint ordering bug (#124):
        #   T1  Field-report repro: apply schema fresh; INSERT one row per suppression_kind
        #       value (5 rows, including 'reality_reconciled'); RE-APPLY the full schema
        #       (simulating re-init on an existing DB) — asserts no constraint-violation error.
        #       The old schema failed here because its first DO block re-added a 4-value CHECK
        #       that was violated by any existing 'reality_reconciled' row.
        #   T2  Categorical invariant: every suppression_kind value assigned in handoff.js
        #       source is present in the schema's final CHECK constraint value set.
        #       Catches any future engine-emitted value missing from the schema.
        # Uses the claude_memory_eval_test DB (created above) with an isolated namespaced
        # schema; drops the namespace on exit — no public schema or real data touched.
        run: node scripts/test-schema-suppression-kind.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run pointer-staleness gate tests
        # Tests the pointer-staleness gate added in feat/pointer-staleness-gate-v2:
        #   T1  symbol anchor matches at cited lines → emit unchanged
        #   T2  symbol moved to different line → pointer rewritten in output + persisted
        #   T3  anchor symbol gone from file → Reconciliation notice, no rewrite
        #   T4  cited file missing → stale-pointer notice, no rewrite
        #   T5  snippet anchor found at different line → pointer rewritten
        #   T6  legacy pointer (no stored anchor) → derive at first encounter, emit unchanged
        #   T7  false-positive guard: host:port in prose → untouched
        #   T8  resume rewrites served output only; close persists anchor only (not object)
        #   T9  multiple assertions citing same stale pointer → gate processes all in output
        #   T10 stale-pointer finding lands in same unified Reconciliation block as
        #       contradiction findings (single ## Reconciliation notice, not two)
        # Self-contained: creates + drops throwaway DB (claude_memory_ptr_gate_<ts>).
        run: node test/handoff/test-pointer-gate.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run predicate-vocabulary audit tests
        # Guards that every predicate written to the assertions table is declared in
        # scripts/lib/predicate-registry.json. Covers four invariants:
        #   T1  auditAssertionPredicates detects an unregistered predicate in the DB
        #       (the has_updated class — previously silently kept by permissive mode)
        #   T2  auditAssertionPredicates returns [] when all rows use registered predicates
        #   T3  validatePayload strict accepts a representative close vocabulary payload
        #       (is_status, commit_merged, in_file, has_updated, shipped_at)
        #   T4  findUnregisteredPredicates confirms has_updated and in_file ARE registered
        #       and the pure helper correctly identifies truly-unknown predicates
        # Reuses claude_memory_eval_test (created above); cleans up its own rows.
        run: node test/handoff/test-predicate-vocabulary.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
