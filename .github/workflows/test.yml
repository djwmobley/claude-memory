name: Tests
# Runs on every pull request to catch regressions before merge.
# Postgres image is pinned to pg16 to match production instance.
# Update the image tag AND this comment when upgrading.
# vLLM is not available in CI; EMBED_SKIP=1 skips embedding
# assertions while structural tests (chunker logic, DB schema,
# incremental sync) still run. The eval-retrieval harness runs
# in --embed-skip mode -- it exercises the SQL/loader/schema path
# but skips vector-quality regression detection. Run the full
# harness locally to catch retrieval-quality regressions.
on: [pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: scripts/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: scripts
      - name: Apply schema
        run: psql -h localhost -U postgres -f scripts/setup.sql
        env:
          PGPASSWORD: postgres
      - name: Run chunker tests
        run: node scripts/test-chunker.js
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/postgres
          EMBED_SKIP: '1'
      - name: Create eval test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE claude_memory_eval_ci"
        env:
          PGPASSWORD: postgres
      - name: Run retrieval eval (FTS-only smoke test)
        run: node test/eval/eval-retrieval.js --embed-skip
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          EVAL_DB_NAME: claude_memory_eval_ci
          # Propagates into the loader subprocess that eval STEP 5 spawns;
          # without this, the loader tries embedding-on-localhost and fails 3x per fixture.
          EMBED_SKIP: '1'
      - name: Create handoff test database
        # test-handoff.js and test-serve-time-staleness.js connect to claude_memory_eval_test
        # (hardcoded TARGET_DB). Create it early — before graph-traversal — so that a
        # single test-suite failure cannot cascade into a spurious "DB does not exist"
        # failure in the north-star steps (which run with if: always()). The test's
        # setup() then applies handoff-core-schema.sql AND app-retrieval-events-schema.sql
        # into it (both are idempotent). This step is a no-op if the DB already exists.
        run: psql -h localhost -U postgres -c "CREATE DATABASE claude_memory_eval_test" || true
        env:
          PGPASSWORD: postgres
      - name: Run init atomicity tests
        # Regression guard for the handoff init atomicity fix (#125).
        # A1-A3: pure unit tests for mintUUID() / persistMarker() (no Postgres required).
        # A4-A5: subprocess injection — unreachable PGHOST forces DB-connect failure;
        #        asserts no .claude-memory marker written and no false "No FS writes made".
        # A6-A7: live Postgres — success path writes marker last; re-init idempotency.
        # A8:    FS-ledger unwind — failed handoff.md write cleans up; marker never written
        #        (POSIX chmod injection; skipped on Windows).
        # Creates/drops throwaway DBs for A6/A7/A8; does NOT use claude_memory_eval_test.
        run: node scripts/test-init-atomic.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run init confirmation gate tests
        # Regression guard for the init DB-confirmation gate (#126).
        # C1: resolved DB name and source tier printed before DDL (pipeline.yml tier).
        # C2: -y bypass proceeds — init completes and writes .claude-memory marker.
        # C3: non-TTY safe-fail — exits non-zero, prints refusal, no marker, no hang
        #     (enforced by 5-second subprocess timeout; key non-vacuous test).
        # C1/C2 use throwaway DBs; C3 does NOT require Postgres (gate fires before preflight).
        run: node scripts/test-init-confirm.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run graph edge-traversal tests
        # Exhaustive harness for kind:'graph' recursive-CTE retrieval feature.
        # Creates/drops throwaway DBs; uses the same Postgres service as the other steps.
        run: node scripts/test-graph-traversal.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run migrate-01-canonical-db tests
        # Tests scripts/migrations/migrate-01-canonical-db.js, the first migration
        # that stands up a consolidation target database (staging-first: default
        # target memory_manager_staging). No cutover/data-migration of any kind.
        # Covers: fresh apply + verification PASS, refusal on a non-empty target
        # without --allow-existing, idempotent re-run with --allow-existing (zero
        # net change), proof-of-firing (verifyTarget FAILS and names a table
        # dropped post-apply), the refusal branch for --db claude_memory_eval_test
        # firing before any DB connection is opened (unreachable-PGHOST proof),
        # refusal of pipeline_*/claude_policy_framework/unrecognized names (total
        # classification — unknown names are refused by default, not allowed
        # through), rejection of an invalid identifier, HANDOFF_DB being ignored
        # (behavioral proof via --db vs HANDOFF_DB divergence), MIGRATE_TARGET_DB
        # env resolution, the built-in default (unit-tested only — never invokes
        # the CLI with no --db, so memory_manager_staging is never created here),
        # and CREATE DATABASE race-safety under real concurrency (both the 42P04
        # and the empirically-observed 23505/pg_database_datname_index shapes).
        # Creates/drops its own _staging-suffixed scratch DBs; never touches
        # claude_memory_eval_test beyond the connection-avoidance assertion.
        run: node test/migrations/test-migrate-01.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run verify-15 acceptance-battery tests
        # Tests scripts/migrations/verify-15-*.js, the §15 acceptance T-battery
        # (13 checks + T10 aggregator) that gates staging->canonical promotion.
        # Proof-of-firing coverage for every check (T0/T0-completeness/T1/
        # freeze-precondition/T2/T2.5/T3/T3b/T4/T5/T6/T7/T8/T9), the T9 NULL-
        # scoped provenance fixture, the T10 recorded_by independence
        # cross-check, and a static sweep for zero live `NOT IN (` SQL in any
        # authored script. Self-contained: creates/drops its own _staging-
        # suffixed scratch DBs; writes roster/fixture JSON to the OS temp dir
        # (never the repo); never touches claude_memory_eval_test/
        # claude_policy_framework/pipeline_*/memory_manager_staging.
        run: node test/migrations/test-verify-15.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run migrate-schema-addenda tests
        # Tests scripts/migrations/migrate-schema-addenda.js, the schema-only
        # addenda runner that applies six net-new SQL pieces on top of a
        # migrate-01-canonical-db.js target: attribution columns
        # (source_model/agent_id on entities/assertions/edges),
        # carryover_status, model_registry, embedding_providers (+ its
        # vllm-local seed row), the routing-harness tables, and the
        # usage-telemetry tables. No data migration.
        # Covers: prerequisite-table refusal on an empty (but existing)
        # target vs. a target that was never created at all (two distinct
        # code paths), fresh apply + full derived verification (tables,
        # columns, declared types, CHECK constraints, indexes/partial-index
        # WHERE clauses, UNIQUE constraints, seed-row values), idempotent
        # re-run, refused target names + a reference-identity proof that
        # classifyTarget is imported from migrate-01 rather than forked,
        # verification proof-of-firing for six distinct perturbations
        # (dropped table, dropped column, pre-existing stub table with
        # missing columns, a column present but its CHECK absent, a deleted
        # seed row, a divergently-updated seed row), static SQL-text
        # invariant sweeps (no INSERT INTO model_registry, every CREATE
        # TABLE/ADD COLUMN uses IF NOT EXISTS, no DROP statements, no CHECK
        # added to a pre-existing column), derivation-helper unit cases
        # against a synthetic fixture, and a forced mid-sequence apply
        # failure followed by an idempotent heal.
        # Creates/drops its own _staging-suffixed scratch DBs; never touches
        # claude_memory_eval_test beyond the connection-avoidance assertion.
        run: node test/migrations/test-migrate-schema-addenda.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run route-resolve + verify-17 routing smoke tests
        # Tests scripts/lib/route-resolve.js (the least-cost routing resolver:
        # routeResolve/recommendLeastCost/resolveRequiredTier) and
        # scripts/migrations/verify-17-routing-smoke.js, the §17.4 5-point
        # operator-run smoke test (idempotency, directive + recommendation
        # recording, least-cost tier-fit-before-cost selection, no-silent-
        # downgrade with the two distinct empty-pool/cost-unconfigured errors,
        # and cross-project isolation including the '*' global-default-pin
        # contract). The smoke script runs its entire fixture lifecycle inside
        # one transaction that is always rolled back -- safe to run against a
        # live staging database.
        # Covers: fresh apply -> exit 0 + all 5 checks PASS; routing_profiles
        # dropped -> prerequisite refusal naming migrate-schema-addenda.js;
        # refused target names; direct lib unit tests for precedence order
        # (override > session override > project pin > global '*' pin >
        # recommendation), required-tier resolution order + the unconfigured
        # hard error, NULL-cost exclusion, deterministic label tiebreak, the
        # distinct empty-pool vs cost-unconfigured errors, the insert-race
        # loser path (and its distinct rationale string), input validation,
        # turnIdx=0, a directive-present + unconfigured-role degrade-to-NULL
        # case, a pin-tier-mismatch rationale case, and the string-vs-numeric
        # cost boundary fixture (rate-sums 9 vs 10).
        # Creates/drops its own _staging-suffixed scratch DBs; never touches
        # claude_memory_eval_test beyond the connection-avoidance assertion.
        run: node test/migrations/test-verify-17.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run usage-telemetry + verify-18 usage smoke tests
        # Tests scripts/lib/usage-telemetry.js (usageRecord/sessionUsageRollup/
        # usageQuery) and scripts/migrations/verify-18-usage-smoke.js, the §18
        # usage-telemetry smoke test (9 checks: record-after-resolve composing
        # with route-resolve.js, record-without-resolve, server-side cost both
        # ways, update-not-duplicate, session-scoped query across model/role/day,
        # rollup + project-scoped query including the staleness contract, input
        # validation + total classification, the all-NULL-cost group, and the
        # cost-range guard). Also covers the shared transaction+rollback/
        # run-prefix/residue-scan harness extracted into
        # scripts/migrations/lib/smoke-harness.js and reused by
        # verify-17-routing-smoke.js (test-verify-17.js passes unmodified against
        # the extracted version -- see the step above), including the harness's
        # per-check SAVEPOINT isolation and the withSavepoint primitive (post-
        # review hardening: a check that provokes a genuine Postgres-level
        # statement error, e.g. a NUMERIC overflow, no longer poisons the
        # shared transaction for later checks or for that same check's own
        # post-failure assertions). The smoke script runs its entire fixture
        # lifecycle inside one transaction that is always rolled back -- safe
        # to run against a live staging database; turn_usage/session_usage are
        # never wiped, only prefix-residue-scanned.
        # Covers: fresh apply -> exit 0 + all 9 checks PASS; session_usage
        # dropped -> prerequisite refusal naming migrate-schema-addenda.js;
        # refused target names; direct lib unit tests for the universal
        # field-preservation matrix, the costUsd three-state machine, every
        # cost fail-soft branch, the outcome DDL-default discipline across
        # insert/update, a genuine concurrent-insert race, the token ceiling,
        # the reserved "(none)" sentinel defense on both write and read paths,
        # rollup NULL-SUM semantics, the zero-turn rollup, "(none)" grouping
        # keys, project-scope staleness, groupBy total classification, pure
        # coercion cases, a genuine concurrent rollup, and the cost-range
        # guard (caller-supplied path, server-computed path -- including the
        # originally-reported near-MAX_SAFE_INTEGER-tokens repro -- and the
        # rollup aggregate path).
        # Creates/drops its own _staging-suffixed scratch DBs; never touches
        # claude_memory_eval_test beyond the connection-avoidance assertion.
        run: node test/migrations/test-verify-18.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run agent-exchange migration + verify-13 smoke tests
        # Tests scripts/migrations/migrate-13-agent-exchange.js (the agent_exchange
        # append-only A2A exchange log + generic audit_log/log_guarded_change()
        # tamper-evidence infrastructure, wired onto every append-only table that
        # exists in the target) and scripts/migrations/verify-13-exchange-smoke.js,
        # its 7-check operator smoke test (post+broadcast+compound-cursor watermark
        # poll, threaded reply reconstruction, a worked cross-agent example,
        # tamper-evidence UPDATE/DELETE, a trigger-coverage report, and the
        # append-only-convention sanity check). Reuses migrate-01-canonical-db.js's
        # and migrate-schema-addenda.js's own exported helpers by reference (never
        # forked); the generic tables/columns/indexes/checks/uniques/seeds
        # verification pass is migrate-schema-addenda.js's own exported
        # verifyAddenda, called with this migration's own SQL file list — no
        # changes to migrate-schema-addenda.js itself. The smoke script runs its
        # entire fixture lifecycle inside one transaction that is always rolled
        # back -- safe to run against a live staging database; nothing is wiped
        # (no global-pool table is involved), only prefix-residue-scanned.
        # Covers: fresh apply -> exit 0 + MIGRATION_RESULT: PASS (FK deferred,
        # tasks absent); idempotent re-run; assertions dropped -> prerequisite
        # refusal naming migrate-01-canonical-db.js; refused target names; smoke
        # fresh apply -> exit 0 + SMOKE13_RESULT: PASS + all 7 checks PASS;
        # agent_exchange dropped -> smoke prerequisite refusal naming
        # migrate-13-agent-exchange.js; direct-client verification proof-of-firing
        # for a dropped trigger, a dropped function, a stubbed function body (body-
        # content check, not just name-match), and a dropped HNSW index on a
        # pgvector-present target (each perturbation healed via re-apply
        # afterward); the conditional FK's three non-FAIL states (deferred when
        # tasks is absent, validated once tasks exists with no orphans, added-
        # not-validated when an orphan docket_id row predates tasks); audit-trigger
        # firing on an ordinary assertions UPDATE (sanctioned mutations captured
        # too, by design); a negative test that audit_log is never self-wired; and
        # static SQL-text invariants (the privacy-scrub floor, no DROP TABLE, and
        # CREATE TABLE ... IF NOT EXISTS discipline).
        # Creates/drops its own _staging-suffixed scratch DBs; never touches
        # claude_memory_eval_test beyond the connection-avoidance assertion.
        run: node test/migrations/test-verify-13.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run seam-tables migration tests (§5.3/§5.9, issue #17)
        # Tests scripts/migrations/migrate-14-seam-tables.js — the 13 §5.3
        # absorbed-seam tables (decisions/gotchas/findings/research/incidents/
        # code_index/tasks/checklist_items/corpus_files/workflow_discovery/
        # agent_rewrites/policy_sections/session_chunks) + §5.9's
        # v_handoff_card_inputs view + a narrow audit_log.row_id BIGINT->TEXT
        # widening. Two documented deviations from §5.3's verbatim DDL text
        # (both additive, both proof-of-fired here): (1) code_index gains a
        # plain `id SERIAL` column (not the PK) so the shared
        # log_guarded_change() trigger function can wire onto it; (2)
        # audit_log.row_id is widened so findings' TEXT-shaped id (e.g.
        # "RT-INJ-001") survives an UPDATE/DELETE through that same trigger
        # without a bigint type-cast error. migrate-13-agent-exchange.sql now
        # ALSO declares row_id TEXT directly and carries the same idempotent
        # widening ALTER itself (post-review fix) — so its own generic self-
        # check converges to PASS on re-apply instead of permanently
        # reporting a wrong-type-column FAIL that would mask real future
        # drift; migrate-14's copy of the ALTER is harmless redundancy.
        # v_handoff_card_inputs (§5.9) is verified BEHAVIORALLY (post-review
        # fix, not a pg_get_viewdef text/substring match, which an AND->OR
        # edit keeping the same tokens would defeat): probe rows are
        # inserted/queried/rolled-back inside a transaction, proving exactly
        # the valid row is visible through the view's filters. Reuses
        # migrate-schema-addenda.js's verifyAddenda for generic derived
        # verification (against the dollar-quote-free migrate-14-seam-
        # tables.sql ONLY, per §7.9/S-16 — the embedding/HNSW DO-blocks live
        # in a separate sidecar file never passed to that derivation layer)
        # and migrate-13-agent-exchange.js's own trigger-wiring DO block
        # (unmodified in its wiring logic) for audit-trigger wiring.
        # Covers: fresh apply -> PASS; idempotent re-run; prerequisite
        # (agent_exchange) missing -> refusal naming migrate-13-agent-
        # exchange.js; re-applying migrate-13-agent-exchange.js after this
        # migration auto-wires all 13 seam tables AND now exits 0 cleanly
        # (17 total *_audit triggers post-§8/M-4 -- entities added -- zero
        # deferred, zero wrong-type
        # columns); the two deviations' proof-of-firing (code_index trigger
        # actually captures UPDATE+DELETE; findings' TEXT id survives the
        # widened column, and reverting the widening is shown to reproduce
        # the original bigint cast failure); and an adversarial regression
        # proving the behavioral view-probe catches an AND->OR-broken view
        # definition that the old substring check would have missed.
        # Creates/drops its own _staging-suffixed scratch DBs; never touches
        # claude_memory_eval_test/memory_manager_staging.
        run: node test/migrations/test-migrate-14-seam-tables.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run decisions data migration tests (§6.1(b), memory-manager#11(b))
        # Tests scripts/migrations/migrate-02-decisions.js — migrates
        # claude_policy_framework.decisions into the structured decisions seam
        # table via the ordered LITERAL/WILDCARD topic-prefix routing
        # classifier in scripts/migrations/topic-prefix-to-project.json.
        # Covers: classifyTopic (LITERAL vs WILDCARD precedence, first-match-
        # wins, unmatched-<first-dash-token> fallback, single-token topics,
        # every real §16.2 rule shape); routing-map D-12 validation (a rule
        # target absent from known_project_ids and not an "unmatched-*"
        # bucket refuses loud, before any DB connection is opened);
        # preconditions D-3 (non-normalized topic) and D-4/M-1 (duplicate
        # topics) refusing loud with nothing inserted; a fresh migrate against
        # a synthetic source table covering every rule shape, verified
        # per-slice against migration_manifest + the decisions rows' project_
        # id/source_project_hint/source_model/authoring_mode; the required
        # decisions_project_topic_unique index; an idempotent re-run (no
        # duplication); manifest transactionality against a FRESH database —
        # a deliberately constraint-violating row mid-slice proves the
        # decisions upserts and the migration_manifest writes roll back
        # together, atomically; and --rollback mode (deletes exactly one
        # source's migrated rows + manifest + row_hashes, leaving an
        # unrelated source's rows untouched).
        # Creates/drops its own scratch databases (target "_staging"-suffixed
        # to satisfy migrate-01's classifyTarget); never touches
        # claude_policy_framework/memory_manager_staging.
        run: node test/migrations/test-migrate-02-decisions.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run file-memory markdown migration tests (§6.1(i))
        # Tests scripts/migrations/migrate-09-file-memory-markdown.js —
        # parses file-memory MEMORY.md index + topic files STRUCTURALLY
        # (frontmatter type -> entities.entity_type, one entities row per
        # topic file keyed on the filename stem, one edges row per resolved
        # [[wiki-link]]), distinct from step (f)'s raw-body corpus sync.
        # Covers (pure, no DB): classifyProjectDir's enrolled/test-artifact-
        # excluded/unmatched-flagged total classification; resolveEntityType's
        # frontmatter.type -> frontmatter.metadata.type -> filename-prefix
        # fallback -> unmatched-type(NULL) branches; listTopicFiles' MEMORY.md
        # exclusion + the .md.bak-<ts> double-suffix extname-boundary fixture;
        # extractWikiLinks' fenced-code/inline-code false-positive avoidance
        # and |alias/#anchor stripping; parseMemoryIndex; and an end-to-end
        # synthetic fixture tree exercising all of the above together.
        # Covers (DB, "_staging"-suffixed scratch target): the prerequisite-
        # table AND prerequisite-column (attribution-columns.sql) refusals;
        # a happy-path migrate (entities/edges/manifest rows, entity_type
        # NULL for the unmatched-type case); an idempotent re-run (proves
        # edges_project_from_type_to_unique + the upsert, not a duplicate
        # insert); the description-never-overwritten-by-another-writer
        # upsert precedence; and --rollback's reference-count-gated entity
        # cleanup (an entity a surviving, differently-tagged edge still
        # references is preserved; one with none is deleted).
        # Creates/drops its own scratch database (target "_staging"-suffixed
        # to satisfy migrate-01's classifyTarget) and its own temp
        # --projects-root fixture tree; never touches
        # claude_policy_framework/memory_manager_staging or the real
        # ~/.claude/projects.
        run: node test/migrations/test-migrate-09-file-memory-markdown.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run handoff-markdown parse unit tests (§6.1(h) H-1..H-14 amendment)
        # Tests scripts/lib/handoff-markdown-parse.js directly -- pure unit tests,
        # no DB, no fixture files on disk (every fixture is an inline SYNTHETIC
        # string literal per H-13's public-repo sanitization rule).
        # Covers every adversary construction named in the authoring brief:
        # H-5/H-6 dash variants + 4-way-split titles + duplicate session N
        # (both rows survive, flagged as a named collision event); H-8 fake
        # headings inside fenced code/blockquotes/HTML comments (single- and
        # multi-line); H-9 pipes-in-cells/backslash escaping/hand-typed
        # variable-cell-count tables (flagged, never index-shifted); H-10 BOM
        # strip, CRLF->LF, trailing-whitespace trim; H-11 nested/multi-line/
        # checkbox NEXT SESSION items; H-12 merged-block detection via the
        # body-length-delta heuristic.
        # Pure unit test -- no Postgres or Ollama required.
        run: node test/migrations/test-handoff-markdown-parse.js
      - name: Run handoff-markdown migration tests (§6.1(h), memory-manager#11(h))
        # Tests scripts/migrations/migrate-08-handoff-markdown.js -- parses a
        # project's HANDOFF.md (active fat card) and .claude/HANDOFF-HISTORY.md
        # (archive) into assertions rows, the markdown-source PEER of the
        # SQL-source migrations (migrate-02 etc.). Mirrors
        # test-migrate-02-decisions.js's/test-migrate-09-file-memory-markdown.js's
        # conventions: self-contained scratch database ("_staging"-suffixed to
        # satisfy migrate-01's own classifyTarget, reused by reference);
        # fixture HANDOFF.md/HANDOFF-HISTORY.md files are SYNTHETIC content
        # written to a scratch temp directory per run, never a real file (H-13).
        # Covers: happy path (both files migrate, DDL preamble columns land,
        # report written); H-1 session_tldr_archived created_at backdated to
        # the parsed session date (never live session_tldr); migration_manifest
        # rows with correct row_count and H-14-normalized filesystem: source_db;
        # idempotent re-run (identical content -> identical row count, no
        # duplication); content-shrink re-run (a removed next_step item is
        # actually gone -- delete-and-reinsert, not accretion); fail-soft when
        # one of --file/--history-file is missing; H-6 loud named collision
        # event when an identical session heading appears in both files (both
        # rows survive); --project-id/--file-or-history-file/--authoring-mode
        # usage validation; and --rollback (deletes exactly this project's
        # tagged rows).
        # Creates/drops its own "_staging"-suffixed scratch database; never
        # touches claude_memory_eval_test/memory_manager_staging.
        run: node test/migrations/test-migrate-08-handoff-markdown.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run own-graph verify/migrate tests (§6.1(c), memory-manager#11(c))
        # Tests scripts/migrations/migrate-verify-own-graph.js — verifies
        # whether claude-memory's own graph data (entities/assertions/edges/
        # retrieval_contract/retrieval_contract_history/project_settings/
        # entity_communities/extraction_queue/retrieval_events/
        # retrieval_event_assertions) lives in the old claude_memory_eval_test
        # fallback DB and migrates the REAL (non-eval-junk) rows into the
        # memory_manager_staging consolidation target. memory_entries/
        # memory_entry_chunks are explicitly out of scope (phase (d)/(f)/(g)).
        # Covers: C-1 total classification (REAL vs JUNK project_id, junk the
        # default branch) against known-own-graph-project-ids.json; C-6
        # idempotent per-(table,project_id)-slice delete-then-reinsert via the
        # own_graph_migration_ids lineage table (registered as battery-infra
        # DDL in verify15-shared.js, NOT a private per-script constant — T0-REG
        # is a regression guard for exactly that registration, reproducing the
        # scenario end-to-end: real migrate run against a disposable target,
