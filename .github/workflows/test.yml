name: Tests
# Runs on every pull request to catch regressions before merge.
# Postgres image is pinned to pg16 to match production instance.
# Update the image tag AND this comment when upgrading.
# Ollama is not available in CI; OLLAMA_SKIP=1 skips embedding
# assertions while structural tests (chunker logic, DB schema,
# incremental sync) still run. The eval-retrieval harness runs
# in --ollama-skip mode -- it exercises the SQL/loader/schema path
# but skips vector-quality regression detection. Run the full
# harness locally to catch retrieval-quality regressions.
on: [pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: scripts/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: scripts
      - name: Apply schema
        run: psql -h localhost -U postgres -f scripts/setup.sql
        env:
          PGPASSWORD: postgres
      - name: Run chunker tests
        run: node scripts/test-chunker.js
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/postgres
          OLLAMA_SKIP: '1'
      - name: Create eval test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE claude_memory_eval_test"
        env:
          PGPASSWORD: postgres
      - name: Run retrieval eval (FTS-only smoke test)
        run: node test/eval/eval-retrieval.js --ollama-skip
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          EVAL_DB_NAME: claude_memory_eval_test
          # Propagates into the loader subprocess that eval STEP 5 spawns;
          # without this, the loader tries Ollama-on-localhost and fails 3x per fixture.
          OLLAMA_SKIP: '1'
      - name: Run graph edge-traversal tests
        # Exhaustive harness for kind:'graph' recursive-CTE retrieval feature.
        # Creates/drops throwaway DBs; uses the same Postgres service as the other steps.
        run: node scripts/test-graph-traversal.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run smoketest (all sections)
        # Runs the full smoketest suite — all 13 sections including collision (OQ-5
        # supersession invariant) and registry (SQL-1:1-index-vs-registry-JSON drift).
        # Previously only --section=gr ran in CI; those two correctness properties were
        # unproven per-PR.  The full run subsumes the former gr-only step exactly.
        run: node scripts/smoketest-handoff.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run SQLite seam tests
        # Unit and integration tests for the SQLite storage adapter (db-seam.js).
        # Guards: resolveDialect, rewriteForSQLite, schema application, JSONB round-trip,
        # graph CTE, abstraction invariant (Section 13), PR-B bi-temporal columns,
        # canonicalization (Section 15), and manual prune (Section 16).
        # Requires Node >= 22 for node:sqlite built-in; exits 0 with SKIP notice on Node 20.
        # CI uses Node 20, so this step always exits 0 but still exercises all static/port checks.
        run: node scripts/test-sqlite-seam.js
      - name: Run both-backend behavioral parity + adversarial-invariant sweep
        # Runs the full adversarial-invariant sweep on BOTH Postgres and SQLite:
        #   S1  PR-B bi-temporal columns (both backends)
        #   S2  Probation lifecycle: live→probation→rehab→re-downable
        #   S3  Terminal is terminal: downvoted_terminal not revived by rehab
        #   S4  Pinned exemption: auto-suppress blocked; explicit override allowed
        #   S5  Canonicalization × supersession: §7 byte-unchanged proof
        #   S6  Prune × bi-temporal: kind-filter precision; dry-run; idempotency; scoping
        #   S7  C2 gate invariant: gate-ON/OFF delta is ONLY outcome_bias term (static)
        #   S8  Abstraction invariant: zero dialect conditionals outside composition root (static + port checks)
        #   S9  Do-not-touch constants: 86400 JS constants intact (static)
        #   S10 No-backfill guarantee: no UPDATE SET subject in engine (static)
        # Postgres half always runs (service is available). SQLite half runs on Node >= 22.
        # CI uses Node 20 — SQLite behavioral half is SKIPPED; Postgres half gates CI.
        # When CI upgrades to Node 22+, both halves will gate automatically.
        run: node scripts/test-both-backends.js
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
