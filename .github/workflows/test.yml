      - name: Run schema bring-forward aged-DB fixture tests (cm#185)
        # Fresh-DB CI cannot exercise any prior-state-dependent schema-apply
        # failure mode (S-11/S-13/S-17/S-19) -- every test-both-backends.js
        # test starts from a schema the harness itself just applied. This
        # suite constructs genuinely aged database states by hand instead:
        #   T1  core-only provision -> drop the 1:1 integrity index -> seed a
