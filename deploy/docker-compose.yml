# claude-memory — Postgres + optional embedder
#
# Two services only, per docs/specs/package-and-installer.md section 4 (owner
# ruling: stdio MCP only -- the handoff-mcp server always launches as a
# stdio subprocess of the host CLI (codex mcp add / Claude hook+settings
# wiring), never as a compose/HTTP service. There is no handoff-mcp
# container here and none is planned.
#
#   postgres  -- pgvector/pgvector:pg16, bound to 127.0.0.1 only, always on.
#   embedder  -- vLLM, behind the `embedder` compose profile (OFF by
#                default: `docker compose up -d` never starts it). Enable
#                explicitly with `docker compose --profile embedder up -d
#                embedder`. Requires a local NVIDIA GPU + the NVIDIA
#                Container Toolkit; the GPU reservation stanza below is
#                commented out by default and untested (see docs/install.md
#                blind spots) -- the service is inert on a host with no
#                capable GPU as long as the profile itself is never
#                activated.
#
# Configure via deploy/.env.example -> deploy/.env. The installer
# (scripts/install.js) generates POSTGRES_PASSWORD and writes deploy/.env
# for you on first run; deploy/.env is gitignored and must never carry a
# real secret into a commit.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      # 127.0.0.1 only -- never 0.0.0.0. Override the host-side port with
      # MM_PG_PORT if 5432 is already taken locally; the container's own
      # port always stays 5432.
      - "127.0.0.1:${MM_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default on purpose -- compose refuses to start this service if
      # POSTGRES_PASSWORD is unset rather than falling back to a hardcoded
      # value. The installer generates an alphanumeric-only password of at
      # least 32 characters and writes it to deploy/.env; it is never
      # committed and never shipped in SHA256SUMS.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env -- generated by the installer on first run, never a hardcoded default. See deploy/.env.example.}
      POSTGRES_DB: ${POSTGRES_DB:-claude_memory}
    volumes:
      - mm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-claude_memory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OFF by default -- `docker compose up -d` alone never starts this
  # service. Enable it explicitly:
  #   docker compose --profile embedder up -d embedder
  embedder:
    profiles: ["embedder"]
    image: ${MM_EMBEDDER_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    command:
      - --model
      - ${MM_EMBEDDER_MODEL:-Qwen/Qwen3-Embedding-8B}
      - --port
      - "8000"
    ports:
      - "127.0.0.1:${MM_EMBEDDER_PORT:-8000}:8000"
    # Requires a local NVIDIA GPU + the NVIDIA Container Toolkit
    # (https://github.com/NVIDIA/nvidia-container-toolkit). Uncomment to
    # reserve one GPU for this container. Untested in this PR -- see
    # docs/install.md's blind-spots section.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  mm_pgdata:
